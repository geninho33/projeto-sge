# Nome fixo do projeto Compose — NÃO usa o nome da pasta "deploy"
# (evita colidir com outras stacks e --remove-orphans apagar containers alheios)
name: projeto-sge

services:
  db:
    image: mariadb:11.4
    container_name: projeto-sge-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sge_pm}
      MYSQL_USER: ${MYSQL_USER:-sge_pm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - projeto-sge
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: projeto-sge-api:latest
    container_name: projeto-sge-api
    restart: unless-stopped
    environment:
      PORT: 3010
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      SQLITE_PATH: /repo/sge-pm-api/data/sge_pm.sqlite
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CRAWL_ROOT: /repo/crawl
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-sge_pm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sge_pm}
    volumes:
      - api_data:/repo/sge-pm-api/data
      - api_avatars:/repo/sge-pm-api/public/avatars
    networks:
      - projeto-sge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/16flow}
    image: projeto-sge-web:latest
    container_name: projeto-sge-web
    restart: unless-stopped
    # Bind só em localhost:9080 — o nginx do host faz proxy de /16flow
    # (não usa 80 nem 8080 do host, que já estão ocupadas)
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-9080}:80"
    networks:
      - projeto-sge
    depends_on:
      api:
        condition: service_healthy

networks:
  projeto-sge:
    name: projeto-sge_net
    driver: bridge

volumes:
  # Nomes explícitos — isolados de outras stacks (ex.: sga, mysql-*)
  mariadb_data:
    name: projeto-sge_mariadb_data
  api_data:
    name: projeto-sge_api_data
  api_avatars:
    name: projeto-sge_api_avatars
