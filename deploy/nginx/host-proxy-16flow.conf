# Proxy do nginx do HOST para o 16Flow (caminho /16flow)
#
# IMPORTANTE: este arquivo contém apenas blocos "location".
# NÃO copie para /etc/nginx/conf.d/ (isso é inválido — location fora de server{}).
#
# Instalação correta:
#   sudo bash deploy/scripts/install-host-proxy.sh
# ou, manualmente, dentro do server { listen 80; ... } do host:
#   include /var/docker/sistema/projeto-sge/deploy/nginx/host-proxy-16flow.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# O container web escuta apenas em 127.0.0.1:9080 (ver WEB_BIND/WEB_PORT no .env).
# Acesso externo: http://IP-DO-SERVIDOR/16flow/  (NÃO use :9080 de outra máquina)

location = /16flow {
    return 301 /16flow/;
}

location /16flow/ {
    proxy_pass http://127.0.0.1:9080/16flow/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 20m;
}
