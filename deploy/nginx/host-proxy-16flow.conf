# Proxy do nginx do HOST para o 16Flow (caminho /16flow)
#
# Instalação típica no Ubuntu:
#   sudo cp deploy/nginx/host-proxy-16flow.conf /etc/nginx/conf.d/16flow.conf
#   # ou inclua no server {} principal:
#   # include /var/docker/sistema/projeto-sge/deploy/nginx/host-proxy-16flow.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# O container web escuta apenas em 127.0.0.1:9080 (ver WEB_BIND/WEB_PORT no .env).

location = /16flow {
    return 301 /16flow/;
}

location /16flow/ {
    proxy_pass http://127.0.0.1:9080/16flow/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 20m;
}
