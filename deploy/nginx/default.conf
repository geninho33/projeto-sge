server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # App publicada em /16flow (evita conflito com outras apps nas portas 80/8080 do host)
    location = /16flow {
        return 301 /16flow/;
    }

    location = / {
        return 301 /16flow/;
    }

    location /16flow/health {
        proxy_pass http://api:3010/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /16flow/api/ {
        proxy_pass http://api:3010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /16flow/avatars/ {
        proxy_pass http://api:3010/avatars/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /16flow/crawl/ {
        proxy_pass http://api:3010/crawl/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /16flow/ {
        try_files $uri $uri/ /16flow/index.html;
    }
}
