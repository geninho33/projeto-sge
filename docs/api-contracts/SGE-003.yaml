openapi: 3.0.3
info:
  title: SGE-003 — Lista de Espera (home)
  version: 0.1.0-spike
  description: Spike Sprint 3 — hselaluno_le_todos.aspx | Score 455
paths:
  /api/v1/lista-espera/criancas:
    get:
      summary: Crianças da lista de espera — todos
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: ano
          in: query
          schema: { type: string }
        - name: vulnerabilidade
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        alunoCodigo: { type: integer }
                        alunoNome: { type: string }
                        dataInscricao: { type: string, format: date }
                        posicaoFila: { type: integer }
                        uePreferencia: { type: string }
                        situacao: { type: string }
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
components:
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20 }
  schemas:
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
